@if (page(); as data) {
  <section class="mx-auto max-w-6xl px-4 py-12 sm:py-16">
    <div class="mx-auto max-w-2xl text-center">
      <h1 class="text-3xl font-bold tracking-tight text-slate-900 sm:text-4xl">Contact Us</h1>
    </div>

    <div class="mx-auto mt-12 max-w-2xl grid grid-cols-1 gap-8 text-justify lg:grid-cols-2">
      @for (entry of data.contactUs; track entry.id) {
        <article>
          <h2 class="text-xl font-semibold text-slate-900">{{ entry.Title }}</h2>

          <div class="mt-4 flex-1 space-y-4">
            <app-strapi-blocks [nodes]="entry.Content" />
          </div>
        </article>
      }
    </div>
  </section>
} @else {
  <p class="py-16 text-center text-slate-500">Loading…</p>
}
